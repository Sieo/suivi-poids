<section class="calendar-card" aria-label="Calendrier des repas">
  <div class="calendar-toolbar">
    <button type="button" aria-label="Mois précédent" (click)="changeMonth(-1)">‹</button>
    <h3>{{ monthLabel() }}</h3>
    <button type="button" aria-label="Mois suivant" (click)="changeMonth(1)">›</button>
  </div>
  <div class="calendar-weekdays" aria-hidden="true">
    @for (weekday of weekdays; track weekday) {
      <span>{{ weekday }}</span>
    }
  </div>
  <div class="calendar-grid" role="group" aria-label="Jours du mois">
    @for (day of days(); track day.date) {
      <button
        type="button"
        class="calendar-day"
        [class.outside-month]="!day.inMonth"
        [class.selected]="selectedDate() === day.date"
        [class.today]="day.isToday"
        [class.has-plan]="day.hasPlan"
        [attr.data-date]="day.date"
        [attr.aria-label]="dayLabel(day)"
        [attr.aria-pressed]="selectedDate() === day.date"
        [attr.aria-current]="day.isToday ? 'date' : null"
        (click)="selectDay(day)"
      >
        <span class="calendar-day-number">{{ day.dayNumber }}</span>
        @if (day.hasPlan) {
          <span class="calendar-plan-dot" aria-hidden="true"></span>
        }
      </button>
    }
  </div>
  <div class="calendar-legend">
    <span class="calendar-plan-dot" aria-hidden="true"></span>
    <span>Repas planifiés ou archivés</span>
  </div>
</section>
